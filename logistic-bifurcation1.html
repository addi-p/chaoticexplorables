<!DOCTYPE html>
<meta charset="utf-8" />
<title>Logistic Explorable (with Axes)</title>
<style>
  html, body { margin: 0; padding: 10;top: 100px; }
  #card { max-width: none; overflow: auto; padding: 100px; }
</style>

<div id="card"></div>

<script type="module">
  import { ExplorableCard } from '/packages/core/src/ExplorableCard.js';
  import LogisticExplorable from '/packages/logisticbifurcation1/src/index.js';

  // KaTeX/css bootstrap happens inside index.js.
  // Turn axes on HERE (no buttons needed).
  const card = new ExplorableCard('#card', {
    ExplorableClass: LogisticExplorable,
    title: '',
    width: 1500,
    explorable: {
      sceneSize: 500,       // left plot (square)
      bifuWidthScale: 1.5,  // width multiplier for the bifurcation plot (right)
      N: 80,
      showAxes: true,
      showBifurcation: true,
      fontScale: 1.0,

      // domain for bifurcation (initial / base domain)
      lambdaMin: 3.0,
      lambdaMax: 4.0,

      // bifurcation density/appearance
      bifurcationIters: 5000,
      bifurcationDiscard: 4900,
      bifurcationSeeds: 10,
      bifuSupersample:2,
      dotAlpha: 0.5,
      bifuDotSizeSS: 5,   // size in supersampled pixels (offscreen)

      // Auto X (domain rescale during play)
      autoZoomX: false,          // toggle default
      autoXStepEvery: 600,       // steps between rescale events
      autoXIncrement: 0.4,       // add to λ_min each rescale
      autoXTargetMin: 3.5        // stop once λ_min reaches this
    }
  });

</script>
