<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SIR Explorable Demo</title>
  <style>
    body { margin: 2rem; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; }
    .slot { border: 1px dashed #e5e7eb; padding: 12px; border-radius: 10px; margin-bottom: 2rem; }
  </style>

  <h1>SIR Explorable</h1>

  <h2>Full (canvas + controls)</h2>
  <div id="full" class="slot"></div>

  <h2>Canvas only</h2>
  <div id="canvas" class="slot"></div>

  <h2>Controls only</h2>
  <div id="controls" class="slot"></div>

  <script type="module">
    import { mountSIRExplorable } from "./explorables/sir/index.js";
    import { mountSIRCanvas } from "./explorables/sir/canvas.js";
    import { mountSIRControls } from "./explorables/sir/controls.js";

    // Full stack
    const full = mountSIRExplorable(document.getElementById("full"), {
      theme: "auto", cssVars: {}, layout: "stack"
    });

    // Canvas only
    const canvas = mountSIRCanvas(document.getElementById("canvas"), {
      theme: "auto", autoplay: true
    });

    // Controls only (hook into the canvas-only instance)
    const controlsHost = document.getElementById("controls");
    const controls = mountSIRControls(controlsHost, { theme: "auto" });
    controlsHost.addEventListener("sir:params", (e) => canvas.setState(e.detail));
    controlsHost.addEventListener("sir:play",   () => canvas.play());
  </script>
</html>
