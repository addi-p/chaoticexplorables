<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Double Pendulum Explorable</title>
  <body style="margin:20px;">
    <div id="dp-mount"></div>

      import { DoublePendulumExplorable } from "./packages/double-pendulum/src/index.js";
