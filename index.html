<div id="card"></div>

<script type="module" is:inline>
  import { ExplorableCard } from '/packages/core/src/ExplorableCard.js';
  import { DoublePendulumExplorable } from '/packages/double-pendulum/src/index.js';

  const card = new ExplorableCard('#card', {
    ExplorableClass: DoublePendulumExplorable,
    title: 'Double Pendulum',
    subtitle: '',
    width: 280, // inner rail width for the card
    explorable: {
      width: 280,
      sceneSize: 280,
      phaseSize: 280,
      showControls: true,
      showPhasePlane: true,
      showTrails: true,
      showButtons: true,   // let the explorable render its toolbar
      transparent: true    // background transparent (SVG + canvas)
    }
  });

  // optional autoplay
  card.play();
</script>
