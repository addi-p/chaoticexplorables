<!DOCTYPE html>
<meta charset="utf-8" />
<title>Logistic Explorable (with Axes)</title>
<style>
  html, body { margin: 0; padding: 0;}
  #card { max-width: none; overflow: auto; padding: 12px; }
</style>

<div id="card"></div>

<script type="module">
  import { ExplorableCard } from '/packages/core/src/ExplorableCard.js';
  import LogisticExplorable from '/packages/logistic/src/index.js';

  // KaTeX/css bootstrap happens inside index.js.
  // Turn axes on HERE (no buttons needed).
  const card = new ExplorableCard('#card', {
    ExplorableClass: LogisticExplorable,
    title: '',
    width: 500,
    explorable: {
      layout: 'stack',
      controlsAt: 'top',
      sceneSize: 500,
      N: 25,
      play:false,
      fontScale: 2.5,  // ← global font scaling
      showCobweb: true,
      showAxes: true    
    }
  });

</script>
